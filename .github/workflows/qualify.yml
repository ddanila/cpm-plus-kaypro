name: Kaypro hardware-candidate software gate
on: [push, workflow_dispatch]
jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential bison automake libncurses-dev
      - if: runner.os == 'macOS'
        run: brew install bison automake coreutils
      - run: python -m pip install pexpect==4.9.0
      - run: python tools/dependencies.py
      - run: python tools/qualify.py --dac build/deps/dac-emulation --host-repo build/deps/8080-cosim --out local/qualification
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualification-${{ matrix.os }}
          path: |
            local/qualification/**/*.json
            local/qualification/**/*.log
            local/qualification/**/*.txt
            build/manifest.json
